<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - 甘肃民俗文化展示平台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main class="container">
  <div class="form-card">
    <h2>注册新用户</h2>
    <div id="alertBox"></div>
    <form id="registerForm">
      <div class="form-group">
        <label>用户名（至少3位，登录时使用）</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group">
        <label>昵称（展示名称，可选）</label>
        <input type="text" id="nickname">
      </div>
      <div class="form-group">
        <label>密码（至少6位）</label>
        <input type="password" id="password" required>
      </div>
      <div class="form-group">
        <label>确认密码</label>
        <input type="password" id="password2" required>
      </div>
      <div class="form-actions">
        <button class="btn" type="submit">注册</button>
      </div>
    </form>
    <div class="form-hint">已有账号？ <a href="login.html">直接登录</a></div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/interactions.js"></script>
<script>
initLayout('');

document.getElementById('registerForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const nickname = document.getElementById('nickname').value;
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  const box = document.getElementById('alertBox');

  if (password !== password2) {
    box.innerHTML = `<div class="alert alert-error">两次输入的密码不一致</div>`;
    return;
  }
  const result = registerUser({ username, password, nickname });
  if (result.ok) {
    setSession(result.user.id);
    box.innerHTML = `<div class="alert alert-success">注册成功，正在跳转...</div>`;
    setTimeout(() => { window.location.href = 'index.html'; }, 500);
  } else {
    box.innerHTML = `<div class="alert alert-error">${escapeHtml(result.msg)}</div>`;
  }
});
</script>
</body>
</html>
