<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 甘肃民俗文化展示平台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main class="container">
  <div class="form-card">
    <h2>用户登录</h2>
    <div id="alertBox"></div>
    <div class="alert alert-info">演示账号：admin / admin123（管理员） 或 demo / demo123（普通用户）</div>
    <form id="loginForm">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" required>
      </div>
      <div class="form-actions">
        <button class="btn" type="submit">登录</button>
      </div>
    </form>
    <div class="form-hint">还没有账号？ <a href="register.html">立即注册</a></div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/interactions.js"></script>
<script>
initLayout('');

document.getElementById('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const result = loginUser({ username, password });
  const box = document.getElementById('alertBox');
  if (result.ok) {
    box.innerHTML = `<div class="alert alert-success">登录成功，正在跳转...</div>`;
    const params = new URLSearchParams(window.location.search);
    const next = params.get('next');
    setTimeout(() => { window.location.href = next || 'index.html'; }, 500);
  } else {
    box.innerHTML = `<div class="alert alert-error">${escapeHtml(result.msg)}</div>`;
  }
});
</script>
</body>
</html>
